<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Pet PWA</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <!-- Timer Section -->
    <div class="timer-section">
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="mode-display" id="mode-display">Focus</div>
      <div class="cycle-display" id="cycle-display">Cycle: 1/4</div>
      <div class="timer-controls">
        <button id="start-btn" class="btn btn-primary">Start</button>
        <button id="pause-btn" class="btn btn-secondary">Pause</button>
        <button id="reset-btn" class="btn btn-secondary">Reset</button>
        <button id="settings-btn" class="btn btn-icon">▼</button>
      </div>
    </div>

    <!-- Settings Dropdown -->
    <div id="settings-dropdown" class="settings-dropdown hidden">
      <div class="settings-section">
        <h3>Custom Duration</h3>
        <div class="input-group">
          <label>Focus (min):</label>
          <input type="number" id="custom-focus" value="25" min="1">
        </div>
        <div class="input-group">
          <label>Break (min):</label>
          <input type="number" id="custom-break" value="5" min="1">
        </div>
        <button id="apply-custom" class="btn btn-small">Apply</button>
      </div>

      <div class="settings-section">
        <h3>Cycles</h3>
        <div class="input-group">
          <label>Total Cycles:</label>
          <input type="number" id="cycle-count" value="4" min="1">
        </div>
        <button id="apply-cycles" class="btn btn-small">Apply</button>
      </div>

      <div class="settings-section">
        <h3>Favorites</h3>
        <div id="favorites-list" class="favorites-list"></div>
        <div class="add-favorite">
          <input type="text" id="favorite-name" placeholder="Name">
          <input type="number" id="favorite-focus" placeholder="Focus" min="1">
          <input type="number" id="favorite-break" placeholder="Break" min="1">
          <button id="add-favorite" class="btn btn-small">Add</button>
        </div>
      </div>
    </div>

    <!-- Reminders Section -->
    <div class="reminders-section">
      <div class="reminders-header">
        <h2>Reminders</h2>
        <button id="add-reminder-btn" class="btn btn-small">+ Add</button>
      </div>
      <div id="reminders-list" class="reminders-list"></div>
    </div>

    <!-- Pet Section -->
    <div class="pet-section">
      <img id="pet-image" class="pet-image" src="/images/Sleeping.png" alt="Pet">
    </div>
  </div>

  <script src="/storage.js"></script>
  <script src="/timer.js"></script>
  <script src="/pet.js"></script>
  <script src="/reminders.js"></script>
  <script src="/app.js"></script>
</body>
</html>
